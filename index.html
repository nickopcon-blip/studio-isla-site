<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f0;
    --ink:#1f1d1a;
    --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block;height:auto}
  a{color:inherit;text-decoration:none}

  /* header — name small top-left, small nav top-right */
  header{display:flex;align-items:baseline;justify-content:space-between;
    padding:2.6rem clamp(1.4rem,5vw,4.6rem) 1.4rem}
  .wordmark{font-size:1.02rem;letter-spacing:.42em;font-weight:500;white-space:nowrap}
  nav{display:flex;gap:1.7rem;flex-wrap:wrap;justify-content:flex-end}
  nav a{font-size:.83rem;letter-spacing:.02em;font-weight:400}
  nav a:hover{text-decoration:underline;text-underline-offset:3px}
  nav a.current{text-decoration:underline;text-underline-offset:3px}

  /* sparse staggered grid — small images, generous whitespace */
  .board{max-width:1460px;margin:0 auto;
    padding:2.6rem clamp(1.4rem,5vw,4.6rem) 4rem;
    display:grid;grid-template-columns:repeat(4,1fr);column-gap:clamp(2.5rem,7.5vw,7.2rem)}
  .col{display:flex;flex-direction:column}
  .col figure{margin:0}
  .col figure.sm{width:82%}
  .col figure.md{width:92%}
  .col figure.right{align-self:flex-end}
  @media(max-width:1000px){
    .board{grid-template-columns:repeat(2,1fr);column-gap:clamp(2rem,6vw,4rem)}
    .c3,.c4{display:none}
    .board .col.c1 figure,.board .col.c2 figure{margin-bottom:4.5rem !important}
  }
  @media(max-width:560px){
    .board{grid-template-columns:1fr}
    .c2{display:none}
    .board .col.c1 figure{width:100%;margin-bottom:3rem !important}
  }

  footer{padding:3.2rem 1.5rem 3.4rem;text-align:center}
  footer .links{font-size:.85rem;letter-spacing:.04em}
  footer .links a:hover{text-decoration:underline;text-underline-offset:3px}
  footer .links span{margin:0 .55rem}
  footer .note{margin-top:1rem;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:#a7a091}
</style>
</head>
